<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>台灣天氣地圖</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="top-bar">

        <div class="top-bar-left">
            <h1>台灣天氣地圖</h1>
            <span class="subtitle">Taiwan Weather Map</span>
        </div>

        <div class="top-bar-right">

            <span id="last-update" class="last-update">
                尚未更新
            </span>

            <button id="refresh-btn" class="refresh-btn" type="button">
                <span id="refresh-icon">↻</span>
                更新資料
            </button>

        </div>

    </header>


    <main class="main-container">

        <!-- ============================= -->
        <!-- 地圖區域 -->
        <!-- ============================= -->

        <section class="map-wrapper">

            <div id="map" class="map"></div>


            <!-- ============================= -->
            <!-- 全台天氣概覽 -->
            <!-- ============================= -->

            <div id="weekly-overview" class="weekly-overview">

                <div class="overview-header">

                    <div>
                        <h2>全台天氣概覽</h2>
                        <p id="overview-subtitle">明天起未來 7 天天氣</p>
                    </div>

                    <button id="overview-toggle" class="overview-toggle" type="button">
                        −
                    </button>

                </div>


                <div id="overview-content" class="overview-content">

                    <!-- 縣市選擇 -->

                    <div class="overview-field">

                        <label for="overview-location">
                            選擇縣市
                        </label>

                        <select id="overview-location" class="overview-select">

                            <option value="">
                                請選擇縣市
                            </option>

                        </select>

                    </div>


                    <!-- 載入中 / 失敗 / 無資料提示 -->

                    <div id="overview-status" class="overview-status hidden" role="status"></div>


                    <!-- 天氣摘要 -->

                    <div id="overview-summary" class="overview-summary">

                        <div class="overview-weather-icon">
                            🌤️
                        </div>

                        <div class="overview-summary-info">

                            <div id="overview-location-name" class="overview-location-name">
                                —
                            </div>

                            <div id="overview-weather" class="overview-weather">
                                —
                            </div>

                        </div>

                    </div>


                    <!-- 溫度 / 降雨機率 -->

                    <div class="overview-temperature">

                        <div class="temperature-item">

                            <span class="temperature-label">
                                最高
                            </span>

                            <strong id="overview-max-temp">
                                —
                            </strong>

                            <span>
                                °C
                            </span>

                        </div>


                        <div class="temperature-item">

                            <span class="temperature-label">
                                最低
                            </span>

                            <strong id="overview-min-temp">
                                —
                            </strong>

                            <span>
                                °C
                            </span>

                        </div>


                        <div class="temperature-item">

                            <span class="temperature-label">
                                降雨機率
                            </span>

                            <strong id="overview-pop">
                                —
                            </strong>

                            <span id="overview-pop-unit">
                                %
                            </span>

                        </div>

                    </div>


                    <!-- 一週溫度折線圖 -->

                    <div class="overview-chart-wrapper">

                        <canvas id="weekly-temperature-chart"></canvas>

                    </div>


                    <!-- 一週天氣列表 -->

                    <div id="weekly-forecast-list" class="weekly-forecast-list"></div>


                    <!-- 預報資料更新時間 -->

                    <div id="overview-updated" class="overview-updated"></div>

                </div>

            </div>


            <!-- ============================= -->
            <!-- Loading -->
            <!-- ============================= -->

            <div id="loading" class="loading-overlay hidden">

                <div class="loading-card">

                    <div class="spinner"></div>

                    <p>
                        正在更新天氣資料...
                    </p>

                </div>

            </div>


            <!-- ============================= -->
            <!-- Message -->
            <!-- ============================= -->

            <div id="message" class="message hidden"></div>

        </section>


        <!-- ============================= -->
        <!-- 氣象圖層控制器 -->
        <!-- ============================= -->

        <aside id="weather-panel" class="weather-panel">

            <div class="layer-panel">

                <!-- 標題 -->

                <div class="layer-panel-header">

                    <h2>
                        氣象圖層
                    </h2>

                    <p>
                        選擇地圖顯示方式
                    </p>

                </div>


                <!-- 圖層選項 -->

                <div class="map-layer-list">


                    <!-- 氣溫 -->

                    <button id="map-layer-temperature" class="map-layer-btn active" type="button"
                        data-map-mode="temperature">

                        <div class="map-layer-icon">
                            🌡️
                        </div>

                        <div class="map-layer-content">

                            <div class="map-layer-title">
                                氣溫
                            </div>

                            <div class="map-layer-description">
                                一般天氣地圖
                            </div>

                        </div>

                        <div class="map-layer-check">
                            ✓
                        </div>

                    </button>


                    <!-- 颱風 -->

                    <button id="map-layer-typhoon" class="map-layer-btn" type="button" data-map-mode="typhoon">

                        <div class="map-layer-icon">
                            🌀
                        </div>

                        <div class="map-layer-content">

                            <div class="map-layer-title">
                                颱風資訊
                            </div>

                            <div class="map-layer-description">
                                颱風位置與路徑
                            </div>

                        </div>

                        <div class="map-layer-check">
                            ✓
                        </div>

                    </button>


                    <!-- 風速風向 -->

                    <button id="map-layer-wind" class="map-layer-btn" type="button" data-map-mode="wind">

                        <div class="map-layer-icon">
                            💨
                        </div>

                        <div class="map-layer-content">

                            <div class="map-layer-title">
                                風速風向
                            </div>

                            <div class="map-layer-description">
                                即時風場資訊
                            </div>

                        </div>

                        <div class="map-layer-check">
                            ✓
                        </div>

                    </button>


                </div>


                <!-- ============================= -->
                <!-- 即時觀測統計（O-A0003-001） -->
                <!-- ============================= -->

                <section id="obs-stats" class="obs-stats">

                    <div class="obs-stats-header">

                        <h3>台灣即時氣象</h3>

                        <span id="obs-stats-badge" class="obs-stats-badge">
                            資料庫
                        </span>

                    </div>

                    <p id="obs-stats-empty" class="obs-stats-empty hidden"></p>

                    <dl class="obs-stats-meta">

                        <div>
                            <dt>觀測時間</dt>
                            <dd id="obs-stats-time">—</dd>
                        </div>

                        <div>
                            <dt>資料來源</dt>
                            <dd>CWA O-A0003-001</dd>
                        </div>

                        <div>
                            <dt>本次讀取</dt>
                            <dd id="obs-stats-read">—</dd>
                        </div>

                        <div>
                            <dt>測站數量</dt>
                            <dd id="obs-stats-count">—</dd>
                        </div>

                    </dl>

                    <div class="obs-stats-grid">

                        <div class="obs-stat obs-stat-hot">
                            <span class="obs-stat-label">最高溫</span>
                            <strong id="obs-max-temp">—</strong>
                            <span id="obs-max-temp-station" class="obs-stat-station"></span>
                        </div>

                        <div class="obs-stat obs-stat-cold">
                            <span class="obs-stat-label">最低溫</span>
                            <strong id="obs-min-temp">—</strong>
                            <span id="obs-min-temp-station" class="obs-stat-station"></span>
                        </div>

                        <div class="obs-stat obs-stat-rain">
                            <span class="obs-stat-label">最大雨量</span>
                            <strong id="obs-max-rain">—</strong>
                            <span id="obs-max-rain-station" class="obs-stat-station"></span>
                        </div>

                        <div class="obs-stat obs-stat-wind">
                            <span class="obs-stat-label">最大風速</span>
                            <strong id="obs-max-wind">—</strong>
                            <span id="obs-max-wind-station" class="obs-stat-station"></span>
                        </div>

                    </div>

                </section>

            </div>

        </aside>

    </main>


    <!-- ============================= -->
    <!-- JavaScript -->
    <!-- ============================= -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"
        integrity="sha384-zYPBGXwO4633CABX/5Spf6emCKUJCfoOkhOMYyxMsatqQZPnDblmmOewfjsIVWCM"
        crossorigin="anonymous"></script>

    <script src="{{ url_for('static', filename='js/map.js') }}"></script>

    <script src="{{ url_for('static', filename='js/weather.js') }}"></script>

</body>

</html>
